# OSV-Scanner exceptions. Every entry needs a reason and an expiry (ignoreUntil); when it expires the
# Security workflow fails again and the exception must be re-evaluated (renew only with a new reason).
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31T00:00:00Z
# reason = "why it does not apply, and when to re-check"

# minimatch 10.2.6 is bundled *inside* the aws-cdk-lib tarball (bundleDependencies), so it cannot be upgraded
# or overridden from this repository; aws-cdk-lib 2.277.0 (latest) still depends on ^10.2.6 and the fix is a
# major (11.0.1). It is build-time only (CDK asset exclude globs from this repository's own code) and never
# sees external input, so the attacker-controlled pattern amplification does not apply.
# Re-check when aws-cdk-lib ships minimatch >= 11.0.1.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31T00:00:00Z
reason = "minimatch bundled in aws-cdk-lib; build-time only, no external input; no upstream fix yet"
