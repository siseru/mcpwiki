name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read # required by codeql-action on private repositories
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          # Uploading to code scanning needs a public repo or GitHub Code Security (CODE_SCANNING_ENABLED=true).
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}
          output: codeql-results
      - name: Fail on CodeQL findings
        run: |
          python3 - <<'PY'
          import glob, json, sys
          # Reviewed exceptions, kept as narrow as a SARIF result lets us (rule + file). Unlike an entry in
          # codeql-config.yml these keep the rule itself enabled everywhere else -- scripts/ also spawns
          # git, aws and npm. Each is still printed as a notice, so it cannot rot silently.
          #
          # js/indirect-command-line-injection, src/cli/main.ts: `mcpwiki edit` starts $EDITOR, and a
          # .cmd/.bat shim (VS Code's only Windows entry point) can only be started through cmd.exe. Every
          # token on that command line is checked against /["&|<>^%!\r\n]/ first and the executable must be
          # a path that exists, so nothing can break out of the quoting; CodeQL does not recognize that
          # check as a sanitizer. Verified with CodeQL 2.27.2. Reviewed 2026-10 (see docs/security.md).
          allowed = {('js/indirect-command-line-injection', 'src/cli/main.ts')}
          results = [r for f in glob.glob('codeql-results/*.sarif') for run in json.load(open(f, encoding='utf-8'))['runs'] for r in run.get('results', [])]
          failures = []
          for r in results:
              loc = r['locations'][0]['physicalLocation']
              uri, line = loc['artifactLocation']['uri'], loc.get('region', {}).get('startLine', 1)
              kind = 'notice' if (r['ruleId'], uri) in allowed or r.get('suppressions') else 'error'
              if kind == 'error':
                  failures.append(r)
              print(f"::{kind} file={uri},line={line}::{r['ruleId']}: {r['message']['text']}")
          print(f"{len(results)} CodeQL finding(s), {len(failures)} not reviewed")
          sys.exit(1 if failures else 0)
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results/
          if-no-files-found: ignore
