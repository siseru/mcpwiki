name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions: read-all

jobs:
  analysis:
    # Scorecard targets public repositories (results publishing + code scanning upload).
    if: vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write # only used to publish results for public repositories
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ !github.event.repository.private && github.event_name != 'schedule' }}
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
