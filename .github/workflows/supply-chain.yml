name: Supply chain

# Runs on every PR that changes dependencies (typically Dependabot). Nothing here has cloud credentials
# or secrets: dependency code is executed only in this unprivileged context.
# Human-review gates are PR labels; adding a label re-runs the checks:
#   supply-chain-reviewed   accept registry findings (age / install scripts / provenance / source)
#   runtime-deps-reviewed   accept a runtime (browser/Lambda) dependency change after reading its diff artifact
#   infra-diff-reviewed     accept security-relevant changes in synthesized CloudFormation
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - package.json
      - package-lock.json
      - tools/deploy/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile review (registry metadata, provenance, runtime diffs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Review new package versions
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/supply-chain/review-lockfile.mjs "origin/${BASE_REF}" package-lock.json tools/deploy/package-lock.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-report
          path: supply-chain-report/
          if-no-files-found: ignore

  infra-diff:
    name: Infrastructure diff (base vs PR synth)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CDK_DEFAULT_ACCOUNT: '123456789012'
      CDK_DEFAULT_REGION: us-west-2
      MCPWIKI_DOMAINS: '{"zoneName":"example.com","hostedZoneId":"Z0123456789EXAMPLE","hosts":{"dev":"wiki-dev.example.com","prod":"wiki.example.com"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Synthesize base and PR (no install scripts, no credentials)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git worktree add ../base "origin/${BASE_REF}"
          for dir in ../base .; do
            (cd "$dir" && npm ci --ignore-scripts && npm run build && npx cdk synth --quiet -c githubRepo=${GITHUB_REPOSITORY} -o cdk.out.synth)
          done
      - name: Compare (strict for dependency-only changes)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          strict=""
          if ! echo "$changed" | grep -qvE '^(package\.json|package-lock\.json|tools/deploy/package(-lock)?\.json)$'; then strict="--strict"; fi
          echo "changed files:"; echo "$changed"; echo "mode: ${strict:-report}"
          node scripts/supply-chain/template-diff.mjs ../base/cdk.out.synth cdk.out.synth $strict
