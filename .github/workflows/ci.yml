name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: cdk synth (includes cdk-nag AwsSolutions checks)
        run: npx cdk synth --quiet -c githubRepo=${{ github.repository }}
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-west-2
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
