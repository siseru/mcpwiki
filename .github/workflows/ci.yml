name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true # the runner image caches an older 24.x (security releases lag behind)
          cache: npm
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: cdk synth (includes cdk-nag AwsSolutions checks)
        # A probe alarm address, so the next step can prove addresses never reach logical ids / paths.
        run: npx cdk synth --quiet -c githubRepo=${GITHUB_REPOSITORY} -c alarmEmail=ci-probe+mcpwiki@example.invalid
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-west-2
      - name: Alarm e-mail stays out of logical ids (deploy logs are public)
        run: node scripts/ci/check-email-exposure.mjs cdk.out ci-probe+mcpwiki@example.invalid
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify registry signatures of installed packages
        run: npm audit signatures

  # The CLI and the MCP stdio bridge are run on developer machines, so keep them working on Windows
  # (paths, %APPDATA%, the browser opener and starting $EDITOR all differ there).
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true # the runner image caches an older 24.x (security releases lag behind)
          cache: npm
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
