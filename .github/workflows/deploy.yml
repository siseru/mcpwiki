name: Deploy

# main -> dev (automatic). Tag v* -> prod (requires approval on the "prod" GitHub Environment).
# Build/test/synth runs without cloud credentials; only the deploy job can mint an OIDC token, and it
# installs dependencies without lifecycle scripts and deploys the already-synthesized cloud assembly.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Opt-in until the AWS side is set up (MCPWiki-ci stack, OIDC subject, environment variables):
    # set the repository variable DEPLOY_ENABLED=true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}
    outputs:
      env: ${{ steps.env.outputs.env }}
    steps:
      - id: env
        run: echo "env=${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in the release path (cache poisoning)
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Synthesize cloud assembly
        run: npx cdk synth --quiet -c githubRepo=${GITHUB_REPOSITORY}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          MCPWIKI_DOMAINS: ${{ vars.MCPWIKI_DOMAINS }}
          MCPWIKI_ALARM_EMAIL: ${{ vars.MCPWIKI_ALARM_EMAIL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cdk-out
          path: cdk.out/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.build.outputs.env }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS (no stored access keys); scoped to this job only
    env:
      ENV_NAME: ${{ needs.build.outputs.env }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in the release path (cache poisoning)
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: cdk-out
          path: cdk.out/
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk deploy (pre-synthesized assembly)
        run: npx cdk deploy --app cdk.out "MCPWiki-${ENV_NAME}-edge" "MCPWiki-${ENV_NAME}" --require-approval never --outputs-file outputs.json
      - name: Smoke test
        run: node scripts/smoke.mjs "$(node -p "require('./outputs.json')['MCPWiki-' + process.env.ENV_NAME].Url")"
