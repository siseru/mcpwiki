name: Deploy

# main -> dev (automatic). Tag v* -> prod (requires approval on the "prod" GitHub Environment).
# Build/test/synth runs without cloud credentials; only the deploy job can mint an OIDC token, and it
# installs dependencies without lifecycle scripts and deploys the already-synthesized cloud assembly.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Opt-in until the AWS side is set up (MCPWiki-ci stack, OIDC subject, environment variables):
    # set the repository variable DEPLOY_ENABLED=true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}
    outputs:
      env: ${{ steps.env.outputs.env }}
    steps:
      - id: env
        run: echo "env=${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # previous release tag for the infrastructure diff
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in the release path (cache poisoning)
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Synthesize cloud assembly
        run: npx cdk synth --quiet -c githubRepo=${GITHUB_REPOSITORY}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          MCPWIKI_DOMAINS: ${{ vars.MCPWIKI_DOMAINS }}
          MCPWIKI_ALARM_EMAIL: ${{ vars.MCPWIKI_ALARM_EMAIL }}
      - name: Infrastructure diff vs previous release (shown before the prod approval)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          MCPWIKI_DOMAINS: ${{ vars.MCPWIKI_DOMAINS }}
          MCPWIKI_ALARM_EMAIL: ${{ vars.MCPWIKI_ALARM_EMAIL }}
        run: |
          git fetch --tags --quiet
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then echo "No previous release tag: first release, nothing to compare." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "Comparing with $prev" >> "$GITHUB_STEP_SUMMARY"
          git worktree add ../prev "$prev"
          (cd ../prev && npm ci --ignore-scripts && npm run build && npx cdk synth --quiet -c githubRepo=${GITHUB_REPOSITORY} -o cdk.out.synth)
          node scripts/supply-chain/template-diff.mjs ../prev/cdk.out.synth cdk.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdk-out
          path: cdk.out/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.build.outputs.env }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS (no stored access keys); scoped to this job only
    env:
      ENV_NAME: ${{ needs.build.outputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in the release path (cache poisoning)
      # Only tools/deploy (aws-cdk CLI, no dependencies) is installed where AWS credentials exist.
      - run: npm ci --ignore-scripts --prefix tools/deploy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cdk-out
          path: cdk.out/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk deploy (pre-synthesized assembly)
        run: tools/deploy/node_modules/.bin/cdk deploy --app cdk.out "MCPWiki-${ENV_NAME}-edge" "MCPWiki-${ENV_NAME}" --require-approval never --outputs-file outputs.json
      - name: Smoke test
        run: node scripts/smoke.mjs "$(node -p "require('./outputs.json')['MCPWiki-' + process.env.ENV_NAME].Url")"
