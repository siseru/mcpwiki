name: Deploy

# main -> dev (automatic). Tag v* -> prod (requires approval on the "prod" GitHub Environment).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS (no stored access keys)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - env:
          MCPWIKI_DOMAINS: ${{ vars.MCPWIKI_DOMAINS }}
        run: npx cdk deploy MCPWiki-dev-edge MCPWiki-dev --require-approval never --outputs-file outputs.json -c githubRepo=${{ github.repository }}
      - run: node scripts/smoke.mjs "$(node -p "require('./outputs.json')['MCPWiki-dev'].Url")"

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - env:
          MCPWIKI_DOMAINS: ${{ vars.MCPWIKI_DOMAINS }}
        run: npx cdk deploy MCPWiki-prod-edge MCPWiki-prod --require-approval never --outputs-file outputs.json -c githubRepo=${{ github.repository }}
      - run: node scripts/smoke.mjs "$(node -p "require('./outputs.json')['MCPWiki-prod'].Url")"
